<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Alterar Status</title><link rel="stylesheet" href="style.css"></head>
<body>
  <div class="screen-container" style="padding:30px;">
    <h2>Alterar Status</h2>
    <div style="display:grid; grid-template-columns: 200px 1fr; gap:20px; margin-top:20px;">
      <div>
        <div class="card-box" style="height:150px; margin-bottom:10px;">🖼</div>
        <p><small>Status:</small></p>
        <div style="background:#e2e8f0; padding:8px; border-radius:4px; font-weight:bold;">📢 Procurando</div>
        <button class="btn-black" style="margin-top:10px; font-size:0.85rem; padding:8px;">Alterar Status</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <h2>Powerbank Branco</h2>
        <label>Marca:</label><input type="text">
        <label>Perdido por: /username/</label>
        <label>Local onde foi perdido:</label><input type="text">
        <label>Descrição Adicional:</label>
        <textarea rows="3">Perdi este Powerbank nas proximidades do segundo andar da Etec. Peço que quem encontrar, chame no telefone (XX) XXXXXX-XXXX.</textarea>
      </div>
    </div>
    <a href="page32.html" class="btn-black" style="margin-top:20px; width:100%; text-align:center;">Salvar Alterações</a>
  </div>
</body>
</html>
