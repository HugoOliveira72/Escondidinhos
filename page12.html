<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Detalhes</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="cade-app.css"></head>
<body>
  <div class="screen-container">
    <header class="app-header">
      <a href="page7.html" class="logo-area"><img src="./IMG/Logo.png" alt=""></a>
      <div class="search-bar"><input type="text" placeholder="Procure aqui seu item!"></div>
       <div class="header-icons"><span><img src="IMG/Adicionar.png" alt=""></span><span><img src="IMG/Barra_de_menu.png" alt=""></span><span><a href="page9.html"><img src="./IMG/Sino.png" alt=""></a></span><a href="page2.html" style="color:white; text-decoration:none;">Entrar</a></div>
    </header>
    <div class="content-body" style="display:grid; grid-template-columns: 200px 1fr; gap:20px;">
      <div>
        <div class="card-box" style="height:150px; margin-bottom:10px;">🖼</div>
        <p><small>Status do Item:</small></p>
        <div style="background:#e2e8f0; padding:8px; border-radius:4px; font-weight:bold;">📢 Procurando</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div style="display:flex; justify-content:space-between;"><h2>Powerbank Branco</h2><span>↩</span></div>
        <p><strong>Marca:</strong> Samsung</p>
        <p><strong>Procurado por:</strong> /Username/</p>
        <p><strong>Local encontrado:</strong> Cantina</p>
        <p><strong>Descrição Adicional:</strong></p>
        <textarea rows="3" readonly></textarea>
        <button onclick="openContactModal()" class="btn-black">Contatar Usuário</button>
      </div>
    </div>

    <!-- Integrated Contact Modal -->
    <div class="modal-overlay" id="contactModal">
      <div class="modal-content">
        <h3>Achou esse item?</h3>
        <p style="font-size:0.9rem;">Contate /username/ e devolva este item!</p>
        <textarea rows="3" readonly>Encontrei este Powerbank anteontem. Meu Whats é (XX) XXXXX-XXX.</textarea>
        <button onclick="alert('Mensagem enviada com sucesso!'); closeModal();" class="btn-black">Enviar Mensagem</button>
        <button onclick="closeContactModal()" class="btn-red" style="background:#718096; padding:8px;">Fechar</button>
      </div>
    </div>
  </div>

  <script>
    function openContactModal() { document.getElementById('contactModal').classList.add('active'); }
    function closeContactModal() { document.getElementById('contactModal').classList.remove('active'); }
  </script>

  <script src="./JS/app.js"></script>
</body>
</html>
