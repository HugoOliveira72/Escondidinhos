<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Lista ADM</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="cade-app.css"></head>
<body>
  <div class="screen-container">
    <header class="app-header">
      <a href="page22.html" class="logo-area">Joana ☰</a>
      <div class="search-bar"><input type="text" placeholder="Procure aqui seu item!"></div>
      <div class="header-icons"><span><img src="IMG/Adicionar.png" alt=""></span><span><img src="IMG/Barra_de_menu.png" alt=""></span><span><a href="page9.html"><img src="./IMG/Sino.png" alt=""></a></span><a href="page2.html" style="color:white; text-decoration:none;"><img src="./IMG/login.png" alt="" width="50px"></a></div>
    </header>
    <div class="content-body">
      <h3>Lista de Administradores</h3>
      <div class="card-box" onclick="openAdminModal()" style="display:flex; justify-content:space-between; align-items:center; text-align:left; cursor:pointer;">
        <strong>Maria Joana</strong>
        <span>⚙ Ações</span>
      </div>
      <div class="card-box" style="display:flex; justify-content:space-between; align-items:center; text-align:left;">
        <strong>Amanda</strong>
        <span>⚙ Ações</span>
      </div>
    </div>

    <!-- Admin Actions Modal -->
    <div class="modal-overlay" id="adminModal">
      <div class="modal-content">
        <div style="background:#cc0000; width:70px; height:70px; border-radius:50%; margin:0 auto; color:white; display:flex; align-items:center; justify-content:center; font-size:1.5rem;">👤</div>
        <h2>Maria Joana</h2>
        <a href="page28.html" class="btn-red">Ver Perfil</a>
        <a href="page27.html" class="btn-red">Alterar Senha</a>
        <button onclick="openDeleteModal()" class="btn-black">Excluir ADM</button>
        <button onclick="closeAdminModal()" class="btn-red" style="background:#718096; padding:8px;">Fechar</button>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="deleteModal" style="z-index: 110;">
      <div class="modal-content">
        <h3>Deseja realmente excluir este ADM?</h3>
        <div style="display:flex; gap:10px; justify-content:center; margin-top:15px;">
          <button onclick="location.href='page25.html'" class="btn-black" style="flex:1;">Sim</button>
          <button onclick="closeDeleteModal()" class="btn-red" style="flex:1;">Não</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function openAdminModal() { document.getElementById('adminModal').classList.add('active'); }
    function closeAdminModal() { document.getElementById('adminModal').classList.remove('active'); }
    function openDeleteModal() { document.getElementById('deleteModal').classList.add('active'); }
    function closeDeleteModal() { document.getElementById('deleteModal').classList.remove('active'); }
  </script>

  <script src="./JS/app.js"></script>
</body>
</html>
