<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Alterar Status Achado</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="cade-app.css"></head>
<body>
  <div class="screen-container" style="padding:30px;">
    <h2>Alterar Status</h2>
    <div style="display:grid; grid-template-columns: 200px 1fr; gap:20px; margin-top:20px;">
      <div>
        <div class="card-box" style="height:150px; margin-bottom:10px;">🖼</div>
        <p><small>Status:</small></p>
        <div style="background:#e2e8f0; padding:8px; border-radius:4px; font-weight:bold;">📋 Achado</div>
        <button class="btn-black" style="margin-top:10px; font-size:0.85rem; padding:8px;">Alterar Status</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <h2>Disco de Vinil</h2>
        <label>Marca:</label><input type="text">
        <label>Encontrado por: /username/</label>
        <label>Local encontrado:</label><input type="text">
        <label>Descrição Adicional:</label>
        <textarea rows="3">Disco de Vinil do cantor Roberto Carlos, capa azul perdido no refeitório da Etec. Telefone para contato: (XX) XXXXXX-XXXX</textarea>
      </div>
    </div>
    <a href="page37.html" class="btn-black" style="margin-top:20px; width:100%; text-align:center;">Salvar Alterações</a>
  </div>

  <script src="./JS/app.js"></script>
</body>
</html>
