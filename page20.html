<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Cadastrar Achado</title><link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="./CSS/registerItem.css"></head>
<body>
  <div class="screen-container" style="padding:30px;">
    <h2>Cadastre seu Item Achado</h2>
    <div style="display:grid; grid-template-columns: 1fr 250px; gap:20px; margin-top:20px;">
      <div style="display:flex; flex-direction:column; gap:15px;">
        <label>Item:</label><input type="text">
        <label>Local onde foi encontrado:</label><input type="text">
        <label>Telefone / Celular</label><input type="text">
        <label>Descrição do Item:</label><textarea rows="3"></textarea>
      </div>
      <div style="display:flex; flex-direction:column; gap:15px; align-items:center;">
        <label style="align-self:flex-start;">Marca</label><input type="text">
        <div class="card-box" style="width:100%; height:150px;">🖼</div>
        <button class="btn-red" style="width:100%; background:#2563eb;">Anexar Arquivo jpg, png</button>
      </div>
    </div>
    <a href="page35.html" class="btn-red" style="margin-top:20px; width:100%; text-align:center;">Cadastrar Item</a>
  </div>
</body>
</html>
