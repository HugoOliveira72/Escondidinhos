<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Entrar</title>
  <link rel="stylesheet" href="registerOrLogin.css">
  <link rel="stylesheet" href="cade-app.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased bg-white">
  <header class="w-full relative header-shadow">
    <svg class="w-full h-24 sm:h-28 md:h-32 block" viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,0 L1440,0 L1440,75 C1050,115 390,75 0,105 Z" fill="#b0b0b0"></path>
      <path d="M0,0 L1440,0 L1440,70 C1050,110 390,70 0,100 Z" fill="#c00d0d"></path>
    </svg>
  </header>
  <main class="flex-grow flex items-center justify-center px-4 py-8 main">
    <div class="w-full max-w-[420px]">
      <h1 class="text-4xl sm:text-5xl font-bold text-center text-black mb-6 tracking-tight">Cadastre-se já</h1>
      <form id="signupForm" data-signup-form class="space-y-4">
        <div class="flex-direction-row" style="gap:12px;">
          <div class="space-y-1" style="flex:1;">
            <label for="signupName" class="block text-gray-800 text-base sm:text-lg">Nome</label>
            <input id="signupName" name="name" type="text" required autocomplete="given-name" class="form-input w-full px-3 py-2 text-gray-900 text-base bg-white">
          </div>
          <div class="space-y-1" style="flex:1;">
            <label for="signupSurname" class="block text-gray-800 text-base sm:text-lg">Sobrenome</label>
            <input id="signupSurname" name="surname" type="text" required autocomplete="family-name" class="form-input w-full px-3 py-2 text-gray-900 text-base bg-white">
          </div>
        </div>
        <div class="space-y-1">
          <label for="signupEmail" class="block text-gray-800 text-base sm:text-lg">E-mail válido</label>
          <input id="signupEmail" name="email" type="email" required autocomplete="email" class="form-input w-full px-3 py-2 text-gray-900 text-base bg-white">
        </div>
        <div class="space-y-1">
          <label for="signupRegistration" class="block text-gray-800 text-base sm:text-lg">Matrícula (opcional)</label>
          <input id="signupRegistration" name="registration" type="text" class="form-input w-full px-3 py-2 text-gray-900 text-base bg-white">
        </div>
        <div class="space-y-1">
          <label for="signupCpf" class="block text-gray-800 text-base sm:text-lg">CPF (opcional)</label>
          <input id="signupCpf" name="cpf" type="text" inputmode="numeric" class="form-input w-full px-3 py-2 text-gray-900 text-base bg-white">
        </div>
        <div class="space-y-1">
          <label for="signupPhone" class="block text-gray-800 text-base sm:text-lg">Telefone (opcional)</label>
          <input id="signupPhone" name="phone" type="tel" class="form-input w-full px-3 py-2 text-gray-900 text-base bg-white">
        </div>
        <div class="space-y-1">
          <label for="signupPassword" class="block text-gray-800 text-base sm:text-lg">Senha</label>
          <input id="signupPassword" name="password" type="password" required minlength="6" autocomplete="new-password" class="form-input w-full px-3 py-2 text-gray-900 text-base bg-white">
        </div>
        <div class="space-y-1">
          <label for="signupConfirmPassword" class="block text-gray-800 text-base sm:text-lg">Repita a senha</label>
          <input id="signupConfirmPassword" name="confirmPassword" type="password" required minlength="6" autocomplete="new-password" class="form-input w-full px-3 py-2 text-gray-900 text-base bg-white">
        </div>
        <button type="submit" class="w-full bg-brand-red hover:bg-red-700 text-white font-bold text-xl py-2.5 rounded-sm shadow-sm">Criar conta</button>
        <div class="text-center text-sm sm:text-base text-gray-800 pt-1"><a href="page2.html" class="hover:underline">Já possuo uma conta</a></div>
      </form>
      <div id="toastMessage" class="hidden mt-6 p-3 text-center text-sm rounded border"></div>
    </div>
  </main>
  <footer class="w-full py-4"></footer>
  <script src="./JS/app.js"></script>
</body>
</html>
