<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cadastrar Perdido</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="./CSS/registerItem.css"><link rel="stylesheet" href="./cade-app.css"></head>
<body>
  <div class="screen-container" style="padding:30px;">
    <a href="page7.html" class="cade-back-link">← Início</a>
    <h2>Cadastre seu item perdido</h2>
    <p class="cade-form-intro">Crie um alerta para que a comunidade possa ajudar a encontrar seu objeto.</p>
    <form class="cade-form" data-item-form data-item-type="lost">
      <div class="cade-form-grid">
        <label>Item:<input name="title" type="text" required maxlength="80" placeholder="Ex.: Garrafa térmica preta"></label>
        <label>Marca:<input name="brand" type="text" placeholder="Marca, se houver"></label>
        <label>Local onde foi perdido:<input name="location" type="text" required placeholder="Ex.: Laboratório 3"></label>
        <label>Telefone / celular:<input name="phone" type="tel" placeholder="Como podem falar com você"></label>
        <label class="cade-full-row">Descrição do item:<textarea name="description" rows="4" placeholder="Quando perdeu, cor, características e outros detalhes"></textarea></label>
        <div class="cade-full-row">
          <label for="lostImage">Foto (JPG, PNG ou WEBP)</label>
          <div class="cade-upload-row"><div class="cade-upload-preview" data-image-preview>🖼</div><input id="lostImage" data-item-image type="file" accept="image/png,image/jpeg,image/webp"></div>
          <small>Imagem de até 1,5 MB. Opcional.</small>
        </div>
      </div>
      <div class="cade-form-actions"><button type="submit" class="btn-red">Cadastrar alerta</button><a href="page31.html" class="btn-black">Cancelar</a></div>
    </form>
  </div>
  <script src="./JS/app.js"></script>
</body>
</html>
